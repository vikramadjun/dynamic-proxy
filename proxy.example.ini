; ============================================================
;  Dynamic Proxy - example configuration
;  Format: [section] headers, then key = value lines.
;  Lines starting with ; are comments.
;  This file is watched live - save your changes and they
;  apply within a few seconds, no restart needed.
; ============================================================

[listen]
; Port to accept connections on (SOCKS5 and HTTP(S) both work on
; the same port at the same time - the protocol is auto-detected)
port = 1080
; 127.0.0.1 = this machine only. 0.0.0.0 = also reachable from
; other devices on the network (be mindful of that).
bind = 127.0.0.1

; --------------------------------------------------------------
; Upstream routes. Sections route1, route2, route3... set the
; PRIORITY order: route1 is tried first, then route2, and so on.
; One of them can be type = direct (bypass every proxy). If no
; "direct" entry exists at all, direct connections are NEVER
; used, even if every proxy below is down.
; --------------------------------------------------------------

[route1]
type = socks5
host = 1.2.3.4
port = 1080
; leave blank if this proxy needs no login/password
username =
password =

[route2]
type = http
; Note: plain (unencrypted) HTTP proxy only for now - see the
; "Known limitations" section of the README.
host = 5.6.7.8
port = 8080
username =
password =

[route3]
type = direct

; --------------------------------------------------------------
; "Is the internet actually there" check - a real HTTP request,
; not a ping.
; --------------------------------------------------------------
[health]
interval_sec = 10
fail_threshold = 2
; check_host / check_port: leave alone unless you have a reason -
; sensible public defaults are used automatically otherwise. If
; you do set check_host, set check_port too.
; check_host =
; check_port = 80

; --------------------------------------------------------------
; Optional local DNS server, for applications that can't route
; DNS through a proxy themselves. Queries are forwarded through
; whichever route above is currently active, with the same
; failover. Off by default.
; --------------------------------------------------------------
[dns]
enabled = no
bind = 127.0.0.1
port = 53
; Repeat this line for multiple resolvers - tried in order for
; each query, moving to the next one whenever a resolver answers
; NXDOMAIN/SERVFAIL/REFUSED, not just on a connection failure.
upstream = 1.1.1.1:53
; Special value: pulls in the DNS servers currently configured on
; every active network adapter.
; upstream = NC

; --------------------------------------------------------------
; Logging: console only by default. Uncomment to also write a
; file. (Same as passing -l path\to\file.log on the command line,
; which always wins over this if both are set.)
; --------------------------------------------------------------
; [log]
; path = proxy.log
